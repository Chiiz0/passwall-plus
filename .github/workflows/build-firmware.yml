name: Build dedicated OpenWrt firmware

on:
  workflow_dispatch:
  push:
    tags:
      - 'firmware-v*'

permissions:
  contents: write

jobs:
  build-x86-64:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5

      - name: Install build and test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            build-essential clang flex bison g++ gawk gcc-multilib gettext \
            git libncurses-dev libssl-dev lua5.1 nodejs python3-setuptools qemu-system-x86 \
            qemu-utils rsync swig unzip zlib1g-dev zstd

      - name: Verify Plus updater
        run: python3 openwrt/tests/test-updater.py

      - name: Verify protected service lifecycle
        run: python3 openwrt/tests/test-switch-lifecycle.py

      - name: Verify release package selection
        run: python3 openwrt/tests/test-package-copy.py

      - name: Verify Plus overview and profile import
        run: |
          lua5.1 openwrt/tests/test-plus-ui.lua
          node openwrt/tests/test-plus-profile.js

      - name: Verify EzCNet command validation
        run: lua5.1 openwrt/tests/test-ezcnet.lua

      - name: Build firmware
        run: ./openwrt/scripts/build-firmware.sh

      - name: Boot and verify firmware
        run: ./openwrt/scripts/test-qemu.sh

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: passwall-plus-openwrt-25.12.6-x86-64
          path: dist/openwrt/25.12.6/
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/firmware-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_version="${GITHUB_REF_NAME#firmware-v}"
          notes=(--generate-notes)
          if [ -f "openwrt/releases/${release_version}.md" ]; then
            notes=(--notes-file "openwrt/releases/${release_version}.md")
          fi
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            "${notes[@]}" \
            --title "PassWall Plus OpenWrt ${release_version}" \
            dist/openwrt/25.12.6/*
